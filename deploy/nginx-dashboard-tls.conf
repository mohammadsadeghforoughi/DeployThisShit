# Managed by DeployThisShit.
server {
    listen 80;
    listen [::]:80;
    server_name @MANAGEMENT_HOST@;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @MANAGEMENT_HOST@;
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/deploythisshit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploythisshit/privkey.pem;
    ssl_session_cache shared:DTS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
